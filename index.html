<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Oca del Machine Learning · MA1062</title>
<style>
:root{
  --navy:#0B1F3A; --navy2:#12345E; --cyan:#22D3EE; --cyanD:#007A99; --cyanL:#CFF6FC;
  --orange:#B45A0C; --orangeL:#FDE7D3; --bg:#F4F7FA; --ink:#1B2B44; --muted:#5B6B80; --line:#D5DEE8; --card:#FDFEFF;
  --ok:#0F7B4A; --bad:#B42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
header{background:var(--navy);color:#F4F7FA;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header h1 span{color:var(--cyan)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:9px 14px;font-weight:600}
.btn{background:var(--navy2);color:#F4F7FA;border-color:#2A4F7F}
.btn:hover{background:#1A4373}
.btn-accent{background:var(--cyan);color:var(--navy)}
.btn-accent:hover{background:#5EE3F4}
.btn-ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:#EAF0F6}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--cyanD);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:var(--card);padding:10px;border-radius:14px;border:1px solid var(--line)}
.cell{position:relative;min-height:78px;border-radius:10px;padding:6px;border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cell .num{font-weight:800;font-size:15px}
.cell .lbl{font-size:11px;line-height:1.15;font-weight:600}
.cell .tokens{display:flex;flex-wrap:wrap;gap:3px;min-height:20px}
.c-CLA{background:var(--cyanL);color:var(--navy)}
.c-FOR{background:#DCE6F5;color:var(--navy)}
.c-CLU{background:var(--orangeL);color:#5A2D06}
.c-GEN{background:#ECEFF3;color:var(--ink)}
.c-OCA{background:var(--navy);color:#F4F7FA}
.c-SPE{background:#FFF3C4;color:#5A4500;border-color:#E0C24D}
.c-START{background:#E3F6EC;color:#0B4D2E}
.c-META{background:var(--cyan);color:var(--navy)}
.cell.active{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset}
.tok{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
aside.panel{display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h2{margin:0 0 8px;font-size:16px;color:var(--navy)}
#turnInfo{font-size:15px;line-height:1.4}
#dieWrap{display:flex;align-items:center;gap:12px;margin-top:10px}
#die{width:64px;height:64px;border-radius:14px;background:var(--navy);color:var(--cyan);font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center}
#die.roll{animation:shake .5s}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(18deg)}50%{transform:rotate(-14deg)}75%{transform:rotate(8deg)}100%{transform:rotate(0)}}
#players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#players li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:14px}
#players li.now{background:var(--cyanL)}
#players .sc{margin-left:auto;font-weight:700;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
#msg{font-size:14px;color:var(--muted);margin-top:6px;min-height:20px}
.overlay{position:fixed;inset:0;background:rgba(11,31,58,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;color:var(--navy);font-size:20px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{text-align:left;background:#F1F5F9;border:1px solid var(--line);color:var(--ink);font-weight:500;padding:12px}
.opt:hover:not(:disabled){background:#E3EEF7}
.opt.right{background:#DDF3E7;border-color:var(--ok)}
.opt.wrong{background:#FCE4E2;border-color:var(--bad)}
.fb{padding:12px;border-radius:10px;font-size:15px;line-height:1.45;display:none}
.fb.ok{display:block;background:#E6F6EE;color:#0B4D2E}
.fb.no{display:block;background:#FDECEA;color:#7A1A12}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
label{font-weight:600;font-size:14px}
input[type=text],select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);width:100%}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#log{max-height:260px;overflow:auto;font-size:13px;line-height:1.45;padding-left:18px;margin:0}
#log li{margin-bottom:4px}
.rules p,.rules li{line-height:1.5;font-size:15px}
.rank{width:100%;border-collapse:collapse;margin-top:10px}
.rank th,.rank td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <h1>La Oca del <span>Machine Learning</span></h1>
  <div class="toolbar">
    <button class="btn" id="bRules">Reglas</button>
    <button class="btn" id="bLog">Bitácora</button>
    <button class="btn-accent" id="bNew">Nueva partida</button>
    <button class="btn" id="bEnd">Terminar partida</button>
  </div>
</header>

<main>
  <section aria-label="Tablero">
    <div id="board"></div>
  </section>
  <aside class="panel">
    <div class="box">
      <h2>Turno</h2>
      <div id="turnInfo">Pulsa <b>Nueva partida</b> para registrar a los jugadores.</div>
      <div id="dieWrap">
        <div id="die" aria-live="polite">–</div>
        <button class="btn-accent" id="bRoll" disabled>Tirar dado</button>
      </div>
      <div id="msg" aria-live="polite"></div>
    </div>
    <div class="box">
      <h2>Jugadores</h2>
      <ul id="players"><li style="color:var(--muted)">Sin partida en curso</li></ul>
    </div>
    <div class="box">
      <h2>Casillas</h2>
      <div class="legend">
        <span><i style="background:var(--cyanL)"></i>Clasificación</span>
        <span><i style="background:#DCE6F5"></i>Forecasting</span>
        <span><i style="background:var(--orangeL)"></i>Clustering</span>
        <span><i style="background:#ECEFF3"></i>Conceptos y evaluación</span>
        <span><i style="background:var(--navy)"></i>Oca</span>
        <span><i style="background:#FFF3C4"></i>Especial</span>
      </div>
    </div>
  </aside>
</main>

<!-- Configuración -->
<div class="overlay" id="ovSetup" role="dialog" aria-modal="true" aria-labelledby="tSetup">
  <div class="modal">
    <h3 id="tSetup">Nueva partida</h3>
    <p style="margin:0 0 12px;color:var(--muted)">Juega cada estudiante con su nombre o forma equipos.</p>
    <label for="mode">Modalidad</label>
    <select id="mode"><option value="ind">Individual (cada estudiante escribe su nombre)</option><option value="eq">Por equipos</option></select>
    <div style="margin-top:10px"><label for="count">Número de jugadores</label>
    <select id="count"></select></div>
    <div class="namegrid" id="names"></div>
    <div class="row">
      <button class="btn-ghost" id="bCancelSetup">Cancelar</button>
      <button class="btn-accent" id="bStart">Comenzar</button>
    </div>
  </div>
</div>

<!-- Pregunta -->
<div class="overlay" id="ovQ" role="dialog" aria-modal="true" aria-labelledby="qText">
  <div class="modal">
    <span class="tag" id="qTag"></span>
    <h3 id="qText"></h3>
    <div class="opts" id="qOpts"></div>
    <div class="fb" id="qFb"></div>
    <div class="row"><button class="btn-accent" id="bQNext" style="display:none">Continuar</button></div>
  </div>
</div>

<!-- Aviso -->
<div class="overlay" id="ovInfo" role="dialog" aria-modal="true" aria-labelledby="iTitle">
  <div class="modal">
    <h3 id="iTitle"></h3>
    <div id="iBody" class="rules"></div>
    <div class="row"><button class="btn-accent" id="bInfoOk">Cerrar</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
var N = 40;
var COLORS = ["#007A99","#B45A0C","#0B1F3A","#7C3AED","#0F7B4A","#C2185B","#5B6B80","#B8860B"];
var CATS = {
  CLA:{name:"Clasificación", tag:"background:#CFF6FC;color:#0B1F3A"},

};

  26:{name:"Validación cruzada", lbl:"Validación: avanza 3"},
  31:{name:"Datos sin etiqueta", lbl:"Sin etiqueta: pierdes 1 turno"},
  34:{name:"Mínimo local", lbl:"Mínimo local: regresa a la 28"},
  39:{name:"Fuga de datos", lbl:"Fuga de datos: regresa a la 30"}

var CYCLE = ["CLA","FOR","CLU","GEN"];

// Banco de preguntas: [categoría, pregunta, [opciones], índice correcto, explicación]
var BANK = [
["GEN","¿Qué hace que un problema sea de aprendizaje supervisado?",["Los datos tienen una etiqueta con la respuesta correcta","Los datos son muy grandes","No hay que limpiar los datos","El modelo no necesita entrenarse"],0,"En el aprendizaje supervisado cada dato trae su etiqueta (aprobó o no, spam o normal) y el modelo aprende a predecirla."],
["GEN","Quieres predecir la calificación final (0 a 100) de un estudiante. ¿Qué tipo de problema es?",["Clustering","Forecasting o regresión","Clasificación","Ninguno"],1,"La salida es un número continuo, así que es un problema de forecasting (regresión)."],
["GEN","Quieres saber si un cliente cancelará su suscripción (sí o no). ¿Qué tipo de problema es?",["Clustering","Forecasting","Clasificación","Reducción de dimensiones"],2,"La salida es una categoría (sí o no): es clasificación."],
["GEN","Quieres descubrir perfiles de clientes sin saber de antemano cuáles existen. ¿Qué usas?",["Clustering","Regresión lineal","Regresión logística","Naive Bayes"],0,"Sin etiquetas, buscamos grupos de elementos parecidos: clustering, aprendizaje no supervisado."],
["GEN","Un modelo acierta 100% en entrenamiento y 55% con datos nuevos. ¿Qué le pasa?",["Subajuste","Sobreajuste","Está perfecto","Le faltan variables"],1,"Memorizó los datos de entrenamiento y no generaliza: es sobreajuste."],
["GEN","¿Para qué se separan datos de prueba?",["Para entrenar más rápido","Para medir el desempeño con datos que el modelo no vio","Para eliminar datos atípicos","Para tener más etiquetas"],1,"Los datos de prueba simulan datos nuevos; con ellos medimos si el modelo generaliza."],
["GEN","En Teachable Machine hiciste 20 pruebas y el modelo acertó 17. ¿Cuál es la exactitud?",["17%","75%","85%","90%"],2,"Exactitud = 17 ÷ 20 × 100 = 85%."],
["GEN","Tu modelo de Teachable Machine falla cuando cambia la iluminación. ¿Qué mejora más?",["Entrenar con imágenes con distintas luces y fondos","Usar menos imágenes","Usar una sola persona","Quitar una categoría"],0,"Más variedad en los datos de entrenamiento ayuda a que el modelo generalice a nuevas condiciones."],
["GEN","¿Qué es la validación cruzada?",["Entrenar y probar varias veces con distintas particiones de los datos","Revisar las etiquetas a mano","Usar dos modelos al mismo tiempo","Graficar los residuos"],0,"Se rota qué parte de los datos sirve de prueba para elegir parámetros de forma más confiable, como el mínimo por hoja."],
["GEN","¿Por qué en Teachable Machine conviene tener una cantidad parecida de imágenes por categoría?",["Para que el modelo no favorezca a la categoría con más ejemplos","Porque si no, no deja entrenar","Para que pese menos el archivo","No importa"],0,"Si una clase tiene muchos más ejemplos, el modelo tiende a predecirla más seguido."],
["CLA","En un árbol de decisión, ¿cómo se llama el nodo de hasta arriba?",["Hoja","Raíz","Rama terminal","Centroide"],1,"La primera pregunta del árbol es el nodo raíz."],
["CLA","En un árbol de clasificación, ¿qué entrega una hoja?",["El promedio del grupo","La categoría mayoritaria del grupo","La pendiente","La distancia al centro"],1,"La hoja de un árbol de clasificación da la categoría con más casos en ella."],
["CLA","¿Cuál es la impureza de Gini de una hoja con 4 que aprueban y 1 que no?",["0.20","0.32","0.50","0.80"],1,"1 − (4/5)² − (1/5)² = 1 − 0.64 − 0.04 = 0.32."],
["CLA","¿Cuál es el Gini de una hoja donde todos aprobaron?",["0","0.5","1","No se puede calcular"],0,"Una hoja pura tiene impureza 0."],
["CLA","Entre tres preguntas candidatas con Gini 0.32, 0.42 y 0.17, ¿cuál va en la raíz?",["La de 0.42","La de 0.32","La de 0.17","Cualquiera"],2,"Se elige la que deja los grupos más puros: el Gini más bajo."],
["CLA","¿Cómo se prueban umbrales para una variable numérica, como horas de estudio?",["Se usa siempre la media","Se ordenan los valores y se prueba el promedio entre cada par de vecinos","Se usa el valor máximo","Se elige al azar"],1,"Cada promedio entre vecinos es un umbral candidato; gana el de menor Gini."],
["CLA","¿Qué técnica ayuda a evitar que un árbol sobreajuste?",["Agregar más hojas","Podar o exigir un mínimo de casos por hoja","Usar Gini igual a 1","Quitar la raíz"],1,"Podar o limitar el crecimiento evita hojas con uno o dos casos."],
["CLA","En Naive Bayes, ¿qué es el prior?",["La probabilidad inicial de cada clase antes de ver el mensaje","La última palabra del mensaje","El número de palabras","El umbral de 50%"],0,"Es la suposición inicial; por ejemplo, 9 de 12 mensajes normales da un prior de 0.75."],
["CLA","«gratis» aparece 6 veces entre las 8 palabras de spam. ¿Cuánto vale P(gratis | spam)?",["0.06","0.25","0.75","6"],2,"6 ÷ 8 = 0.75."],

["CLA","¿Qué forma tiene la curva de la regresión logística?",["Recta","Parábola","Curva en S que va de 0 a 1","Escalones"],2,"La función logística es una curva en S, y se lee como probabilidad."],

["CLA","¿Con qué método se ajusta la regresión logística?",["Mínimos cuadrados","Máxima verosimilitud","Gini","Distancia euclidiana"],1,"Busca la curva que hace más probable observar los datos reales."],
["CLA","¿Qué prueba indica si una variable sirve en la regresión logística?",["Prueba de Wald","Método del codo","Impureza de Gini","Enlace simple"],0,"La prueba de Wald revisa si el efecto de la variable es distinto de cero."],
["CLA","¿Qué tipo de modelo entrenas en Teachable Machine?",["Clustering","Regresión lineal","Clasificación supervisada","Árbol de regresión"],2,"Cada imagen tiene la etiqueta de su categoría: es clasificación supervisada."],

["FOR","¿Por qué se llama «mínimos cuadrados»?",["Porque usa pocos datos","Porque elige la recta con la menor suma de residuos al cuadrado","Porque la pendiente es pequeña","Porque eleva x al cuadrado"],1,"Se busca la recta que minimiza la suma de los residuos al cuadrado."],
["FOR","Con Calificación = 50 + 4 × horas, ¿cuánto se predice con 8 horas?",["58","74","82","90"],2,"50 + 4 × 8 = 82."],
["FOR","Variación alrededor de la media = 100 y alrededor de la recta = 40. ¿Cuánto vale R²?",["0.40","0.60","1.40","2.50"],1,"(100 − 40) ÷ 100 = 0.60."],
["FOR","R² = 0.60 significa que...",["El modelo acierta 60% de las veces","La variable explica 60% de la variación de y","La pendiente es 0.60","El valor p es 0.60"],1,"R² es la proporción de la variación explicada por el modelo."],
["FOR","¿Para qué sirve el valor p en regresión lineal?",["Para saber si la relación encontrada es confiable y no fruto del azar","Para calcular la pendiente","Para elegir el umbral","Para medir distancias"],0,"Con pocos datos, cualquier recta ajusta bien; el valor p, a partir de F, dice si la relación es significativa."],

["FOR","¿Cómo elige su corte un árbol de regresión?",["Menor Gini","Menor suma de residuos al cuadrado","Mayor R²","Al azar"],1,"Prueba umbrales y se queda con el de menor suma de residuos al cuadrado."],
["FOR","¿Cuándo conviene un árbol de regresión en lugar de una recta?",["Cuando la relación sube y luego baja, sin forma de recta","Cuando hay solo dos datos","Cuando y es una categoría","Nunca"],0,"Por ejemplo, sueño y calificación: poco y demasiado sueño bajan la calificación."],
["FOR","Un árbol de regresión predice perfecto todos los datos de entrenamiento. ¿Qué indica?",["Que es el mejor modelo","Probable sobreajuste","Que R² es cero","Que no hay varianza en y"],1,"Sin sesgo pero con mucha varianza: probablemente falle con datos nuevos."],

["CLU","¿Cuándo se detiene K-means?",["Cuando los grupos ya no cambian","Después de una iteración","Cuando K llega a cero","Cuando todos los puntos están en un grupo"],0,"Se repite asignar y recalcular centros hasta que nada cambia."],
["CLU","¿Por qué K-means se ejecuta varias veces?",["Porque el resultado depende de los centros iniciales al azar","Para aumentar K","Para tener etiquetas","Para calcular R²"],0,"Se guarda el agrupamiento con menor variación dentro de los grupos."],
["CLU","¿Qué método ayuda a elegir el valor de K?",["Método del codo","Prueba de Wald","Mínimos cuadrados","Enlace completo"],0,"Se grafica la variación contra K y se busca el punto donde deja de bajar mucho."],

["CLU","¿Qué es el enlace simple?",["La distancia entre los miembros más cercanos de dos grupos","La distancia entre los más lejanos","El promedio de todas las distancias","La distancia al centro"],0,"Enlace completo usa los más lejanos; promedio, el promedio de todos los pares."],
["CLU","¿Cómo se llama el diagrama de árbol del clustering jerárquico?",["Histograma","Dendrograma","Diagrama de caja","Árbol de regresión"],1,"El dendrograma muestra a qué altura se une cada grupo."],
["CLU","¿Cómo eliges cuántos grupos tomar en un dendrograma?",["Cortándolo con una línea horizontal a cierta altura","Contando las hojas","Con la prueba de Wald","Con el prior"],0,"Las uniones muy altas separan grupos muy distintos; ahí conviene cortar."],
["CLU","Con 100 mil estudiantes, ¿qué método de clustering es más práctico?",["Jerárquico","K-means","Ambos igual","Ninguno"],1,"El jerárquico necesita todas las distancias por pares; K-means escala mucho mejor."],
["CLU","¿Qué diferencia principal hay entre K-means y jerárquico?",["K-means pide K al inicio; el jerárquico muestra todas las uniones","K-means usa etiquetas","El jerárquico predice números","No hay diferencia"],0,"En el jerárquico decides el número de grupos después, al cortar el dendrograma."]
];

// --- Estado ---
var S = null;
var used = {};
var $ = function(id){return document.getElementById(id);};

function cellType(i){
  if(i===0) return "START";
  if(i===N) return "META";
  if(OCAS.indexOf(i)>=0) return "OCA";
  if(SPECIAL[i]) return "SPE";
  return CYCLE[i % CYCLE.length];
}
function cellLabel(i){
  var t=cellType(i);
  if(t==="START") return "Salida";
  if(t==="META") return "Meta";
  if(t==="OCA") return "Oca: pregunta y salta";
  if(t==="SPE") return SPECIAL[i].lbl;
  return CATS[t].name;
}

// Tablero en serpentina: 41 casillas (0 a 40), 8 columnas
function buildBoard(){
  var b=$("board"); b.innerHTML="";
  var cols=8, rows=Math.ceil((N+1)/cols);
  var order=[];
  for(var r=0;r<rows;r++){
    var row=[];
    for(var c=0;c<cols;c++){ var idx=r*cols+c; row.push(idx<=N?idx:null); }
    if(r%2===1) row.reverse();
    order=order.concat(row);
  }
  order.forEach(function(i){
    var d=document.createElement("div");
    if(i===null){ d.style.visibility="hidden"; b.appendChild(d); return; }
    d.className="cell c-"+cellType(i);
    d.id="cell"+i;
    d.innerHTML='<div class="num">'+i+'</div><div class="lbl">'+cellLabel(i)+'</div><div class="tokens" id="tk'+i+'"></div>';
    d.setAttribute("aria-label","Casilla "+i+": "+cellLabel(i));
    b.appendChild(d);
  });
}

function drawTokens(){
  for(var i=0;i<=N;i++){ var t=$("tk"+i); if(t) t.innerHTML=""; var c=$("cell"+i); if(c) c.classList.remove("active"); }
  if(!S) return;
  S.players.forEach(function(p,k){
    var t=document.createElement("div");
    t.className="tok"; t.style.background=p.color;
    t.textContent=initials(p.name); t.title=p.name;
    $("tk"+p.pos).appendChild(t);
  });
  var cur=S.players[S.turn];
  if(cur && !S.over) $("cell"+cur.pos).classList.add("active");
}
function initials(n){ var w=n.trim().split(/\s+/); return (w[0][0]+(w[1]?w[1][0]:"")).toUpperCase(); }

function renderPlayers(){
  var ul=$("players"); ul.innerHTML="";
  if(!S){ ul.innerHTML='<li style="color:var(--muted)">Sin partida en curso</li>'; return; }
  S.players.forEach(function(p,k){
    var li=document.createElement("li");
    if(k===S.turn && !S.over) li.className="now";
    li.innerHTML='<span class="tok" style="background:'+p.color+'">'+initials(p.name)+'</span><span>'+esc(p.name)+' · casilla '+p.pos+(p.skip?' · pierde turno':'')+'</span><span class="sc">'+p.score+' pts</span>';
    ul.appendChild(li);
  });
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function updateTurn(){
  if(!S){ $("turnInfo").innerHTML='Pulsa <b>Nueva partida</b> para registrar a los jugadores.'; $("bRoll").disabled=true; return; }
  if(S.over){ $("bRoll").disabled=true; return; }
  var p=S.players[S.turn];
  $("turnInfo").innerHTML='Turno de <b>'+esc(p.name)+'</b> (casilla '+p.pos+').';
  $("bRoll").disabled=false;
  renderPlayers(); drawTokens();
}
function log(t){ if(S) S.log.push(t); }
function say(t){ $("msg").textContent=t; }

// --- Configuración ---
function openSetup(){
  var cnt=$("count"); cnt.innerHTML="";
  for(var i=2;i<=8;i++){ var o=document.createElement("option"); o.value=i; o.textContent=i; cnt.appendChild(o); }
  cnt.value="4"; renderNames(); show("ovSetup");
  setTimeout(function(){ var f=$("names").querySelector("input"); if(f) f.focus(); },50);
}
function renderNames(){
  var n=+$("count").value, eq=$("mode").value==="eq", g=$("names"), prev=[].map.call(g.querySelectorAll("input"),function(x){return x.value;});
  g.innerHTML="";
  for(var i=0;i<n;i++){
    var w=document.createElement("div");
    var lab=eq?("Equipo "+(i+1)):("Estudiante "+(i+1));
    w.innerHTML='<label for="nm'+i+'">'+lab+'</label><input type="text" id="nm'+i+'" maxlength="24" placeholder="'+(eq?"Nombre del equipo":"Nombre")+'">';
    g.appendChild(w);
    if(prev[i]) w.querySelector("input").value=prev[i];
  }
}
function startGame(){
  var n=+$("count").value, eq=$("mode").value==="eq", players=[];
  for(var i=0;i<n;i++){
    var v=$("nm"+i).value.trim() || (eq?("Equipo "+(i+1)):("Jugador "+(i+1)));
    players.push({name:v,color:COLORS[i],pos:0,score:0,skip:false});
  }
  S={players:players,turn:0,over:false,log:[],rolls:0};
  used={};
  hide("ovSetup");
  log("Nueva partida ("+(eq?"equipos":"individual")+"): "+players.map(function(p){return p.name;}).join(", ")+".");
  say("¡A jugar! Lleguen exacto a la casilla 40.");
  $("die").textContent="–";
  updateTurn();
}

// --- Juego ---
function roll(){
  if(!S||S.over) return;
  $("bRoll").disabled=true;
  var d=$("die"); d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll");
  var v=1+Math.floor(Math.random()*6), k=0;
  var anim=setInterval(function(){ d.textContent=1+Math.floor(Math.random()*6); if(++k>6){ clearInterval(anim); d.textContent=v; move(v); } },60);
}
function move(v){
  var p=S.players[S.turn], from=p.pos, to=from+v;
  if(to>N){ to=N-(to-N); log(p.name+" sacó "+v+" y rebota: de "+from+" a "+to+"."); say("Rebote: hay que llegar exacto a la 40."); }
  else log(p.name+" sacó "+v+": de "+from+" a "+to+".");
  p.pos=to; S.from=from; renderPlayers(); drawTokens();
  setTimeout(function(){ landing(); },350);
}
function landing(){
  var p=S.players[S.turn], t=cellType(p.pos);
  if(p.pos===N){ return win(p); }
  if(t==="OCA"){ ask(randomCat(), "oca"); return; }
  if(t==="SPE"){ special(p); return; }
  ask(t,"normal");
}
function randomCat(){ return CYCLE[Math.floor(Math.random()*CYCLE.length)]; }
function special(p){
  var i=p.pos, sp=SPECIAL[i], txt="";
  if(i===6){ p.pos=12; txt="Cruzas el puente: avanzas a la casilla 12."; }
  else if(i===19||i===31){ p.skip=true; txt=(i===19?"Tu modelo memorizó los datos de entrenamiento.":"Sin etiquetas no puedes entrenar un clasificador.")+" Pierdes 1 turno."; }
  else if(i===26){ p.pos=29; txt="Validaste bien tu modelo: avanzas a la casilla 29."; }
  else if(i===34){ p.pos=28; txt="Te quedaste en un mínimo local: regresas a la casilla 28."; }
  else if(i===39){ p.pos=30; txt="Usaste datos de prueba para entrenar: regresas a la casilla 30."; }
  log(p.name+" cae en «"+sp.name+"». "+txt);
  info(sp.name, "<p>"+txt+"</p>", function(){
    var t=cellType(p.pos);
    if(i===6||i===26){ if(t==="OCA"){ ask(randomCat(),"oca"); return; } if(CATS[t]){ ask(t,"normal"); return; } }
    nextTurn();
  });
}
function pick(cat){
  var pool=[]; BANK.forEach(function(q,k){ if(q[0]===cat && !used[k]) pool.push(k); });
  if(!pool.length){ BANK.forEach(function(q,k){ if(q[0]===cat) delete used[k]; }); return pick(cat); }
  var k=pool[Math.floor(Math.random()*pool.length)]; used[k]=true; return k;
}
function ask(cat,kind){
  var k=pick(cat), q=BANK[k], p=S.players[S.turn];
  $("qTag").textContent=(kind==="oca"?"Oca · ":"")+CATS[cat].name+" · "+p.name;
  $("qTag").setAttribute("style",CATS[cat].tag);
  $("qText").textContent=q[1];
  var box=$("qOpts"); box.innerHTML="";
  var idx=[0,1,2,3].sort(function(){return Math.random()-.5;});
  idx.forEach(function(o,n){
    var b=document.createElement("button");
    b.className="opt"; b.textContent=String.fromCharCode(65+n)+") "+q[2][o];
    b.onclick=function(){ answer(k,o,b,kind); };
    box.appendChild(b);
  });
  var fb=$("qFb"); fb.className="fb"; fb.textContent="";
  $("bQNext").style.display="none";
  show("ovQ");
  setTimeout(function(){ box.querySelector("button").focus(); },50);
}
function answer(k,o,btn,kind){
  var q=BANK[k], ok=(o===q[3]), p=S.players[S.turn];
  [].forEach.call($("qOpts").children,function(b){ b.disabled=true; if(b.textContent.slice(3)===q[2][q[3]]) b.classList.add("right"); });
  if(!ok) btn.classList.add("wrong");
  var fb=$("qFb");
  var res="";
  if(ok){
    p.score++;
    if(kind==="oca"){
      var nx=OCAS.filter(function(x){return x>p.pos;})[0];
      if(nx){ res=" De oca a oca: saltas a la casilla "+nx+" y tiras otra vez."; S.again=true; p.pos=nx; }
      else { res=" Es la última oca: tiras otra vez."; S.again=true; }
    } else res=" Te quedas en la casilla "+p.pos+".";
    fb.className="fb ok"; fb.innerHTML="<b>¡Correcto! +1 punto.</b>"+res+"<br>"+q[4];
    log(p.name+" respondió bien («"+q[1]+"»)."+res);
  } else {
    p.pos=S.from;
    fb.className="fb no"; fb.innerHTML="<b>Incorrecto.</b> Regresas a la casilla "+S.from+".<br>Respuesta correcta: "+esc(q[2][q[3]])+". "+q[4];
    log(p.name+" falló («"+q[1]+"») y regresa a la casilla "+S.from+".");
  }
  $("bQNext").style.display="inline-block"; $("bQNext").focus();
  renderPlayers(); drawTokens();
}
function nextTurn(){
  if(!S||S.over) return;
  if(S.again){ S.again=false; say(S.players[S.turn].name+" tira otra vez."); updateTurn(); return; }
  var n=S.players.length, guard=0;
  do{
    S.turn=(S.turn+1)%n;
    var p=S.players[S.turn];
    if(p.skip){ p.skip=false; log(p.name+" pierde su turno."); guard++; continue; }
    break;
  }while(guard<=n);
  say(""); updateTurn();
}
function win(p){
  p.score+=3; S.over=true;
  log("¡"+p.name+" llega a la meta! +3 puntos.");
  renderPlayers(); drawTokens();
  showRanking("¡"+esc(p.name)+" llegó a la meta!");
}
function showRanking(title){
  var r=S.players.slice().sort(function(a,b){ return b.pos-a.pos || b.score-a.score; });
  var h='<p>Gana quien llega a la casilla 40. El resto se ordena por casilla y luego por puntos (respuestas correctas).</p><table class="rank"><tr><th>Lugar</th><th>Jugador</th><th>Casilla</th><th>Puntos</th></tr>';
  r.forEach(function(p,i){ h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.pos+'</td><td>'+p.score+'</td></tr>'; });
  h+='</table>';
  info(title,h);
  $("bRoll").disabled=true;
  $("turnInfo").innerHTML='Partida terminada. Pulsa <b>Nueva partida</b> para volver a jugar.';
}
function endGame(){
  if(!S||S.over){ info("Terminar partida","<p>No hay una partida en curso.</p>"); return; }
  S.over=true; log("Partida terminada por el profesor o el grupo.");
  renderPlayers(); drawTokens(); showRanking("Resultados de la partida");
}

// --- Modales ---
var infoCb=null;
function info(title,html,cb){ $("iTitle").textContent=title; $("iBody").innerHTML=html; infoCb=cb||null; show("ovInfo"); setTimeout(function(){$("bInfoOk").focus();},50); }
function show(id){ $(id).classList.add("show"); }
function hide(id){ $(id).classList.remove("show"); }

function rules(){
  info("Reglas", '<ol>'+
  '<li>Juegan de 2 a 8 estudiantes o equipos. Todos inician en la Salida (casilla 0).</li>'+
  '<li>En tu turno tira el dado y avanza. Para ganar hay que caer <b>exacto</b> en la 40; si te pasas, rebotas hacia atrás.</li>'+
  '<li><b>Casillas de color:</b> responde una pregunta del tema (clasificación, forecasting, clustering o conceptos y evaluación). Si aciertas, ganas 1 punto y te quedas. Si fallas, regresas a la casilla donde estabas.</li>'+
  '<li><b>Ocas</b> (casillas azul marino): responde una pregunta de cualquier tema. Si aciertas, «de oca a oca»: saltas a la siguiente oca y tiras otra vez.</li>'+
  '<li><b>Casillas especiales</b> (amarillas): Puente (6) te lleva a la 12; Sobreajuste (19) y Datos sin etiqueta (31) te hacen perder 1 turno; Validación cruzada (26) te adelanta a la 29; Mínimo local (34) te regresa a la 28; Fuga de datos (39) te regresa a la 30.</li>'+
  '<li>Llegar a la meta da 3 puntos extra. Si la partida se termina antes, gana quien esté más adelante; en empate, quien tenga más puntos.</li>'+
  '<li>Respondan sin consultar apuntes: el objetivo es repasar. Cada respuesta trae una explicación para aprender del error.</li>'+
  '</ol>');
}
function showLog(){
  if(!S||!S.log.length){ info("Bitácora","<p>Todavía no hay movimientos registrados.</p>"); return; }
  info("Bitácora", '<ol id="log">'+S.log.map(function(l){return "<li>"+esc(l)+"</li>";}).join("")+'</ol>');
}

$("bRules").onclick=rules;
$("bLog").onclick=showLog;
$("bNew").onclick=openSetup;
$("bEnd").onclick=endGame;
$("bRoll").onclick=roll;
$("bStart").onclick=startGame;
$("bCancelSetup").onclick=function(){ hide("ovSetup"); };
$("count").onchange=renderNames;
$("mode").onchange=renderNames;
$("bQNext").onclick=function(){ hide("ovQ"); nextTurn(); };
$("bInfoOk").onclick=function(){ hide("ovInfo"); var c=infoCb; infoCb=null; if(c) c(); };
document.addEventListener("keydown",function(e){
  if(e.key==="Escape" && $("ovInfo").classList.contains("show") && !infoCb) hide("ovInfo");
});

buildBoard();
drawTokens();
})();
</script>
